# spring-router config — known-good starting point (v0.2.0)
# Default auto-generated by ensureConfig on first run. host 127.0.0.1 = localhost ONLY.
server:
  host: 127.0.0.1
  port: 30128
  readTimeout: 30
  writeTimeout: 0
  idleTimeout: 120

store:
  path: ~/.spring-router/data.db
  kind: sqlite

balancer:
  strategy: round-robin
  maxConsecutiveErrors: 3
  backoffBaseSeconds: 2
  backoffMaxSeconds: 60

refresh:
  intervalSeconds: 30
  leadMs: 300000

# Optional fallback chains: model A → B → C on failure
# combos:
#   - id: my-combo
#     name: Grok → Codex
#     models: [gcli/grok-4.5, cx/gpt-5.6-sol]

providers:
  - id: grok-cli
    alias: gcli
    displayName: Grok CLI (Grok Build)
    category: oauth
    authType: oauth
    strategy: round-robin
    transport:
      baseUrl: https://cli-chat-proxy.grok.com/v1
      format: openai-responses
      forceStream: true
      modelsUrl: https://cli-chat-proxy.grok.com/v1/models
      userUrl: https://cli-chat-proxy.grok.com/v1/user
      tokenAuth: xai-grok-cli
      headers:
        User-Agent: grok-pager/0.2.93 grok-shell/0.2.93 (linux; x86_64)
    oauth:
      clientId: b1a00492-073a-47ea-816f-4c329264a828
      deviceCodeUrl: https://auth.x.ai/oauth2/device/code
      tokenUrl: https://auth.x.ai/oauth2/token
      refreshUrl: https://auth.x.ai/oauth2/token
      scope: "openid profile email offline_access grok-cli:access api:access conversations:read conversations:write"
      referrer: grok-build
      refreshLeadMs: 300000
    models:
      - id: grok-4.5
        name: Grok 4.5
        reasoningEfforts: [low, medium, high, xhigh]
        defaultEffort: high
      - id: grok-4.5-high
        name: Grok 4.5 (High)
        upstream: grok-4.5
        defaultEffort: high
      - id: grok-4.5-medium
        name: Grok 4.5 (Medium)
        upstream: grok-4.5
        defaultEffort: medium
      - id: grok-4.5-low
        name: Grok 4.5 (Low)
        upstream: grok-4.5
        defaultEffort: low
      - id: grok-build
        name: Grok Build
        contextLength: 500000
        maxOutputTokens: 64000

  - id: codex
    alias: cx
    displayName: OpenAI Codex
    category: oauth
    authType: oauth
    strategy: round-robin
    transport:
      baseUrl: https://chatgpt.com/backend-api/codex/responses
      format: openai-responses
      forceStream: true
      tokenAuth: bearer
      headers:
        originator: codex_cli_rs
        User-Agent: codex_cli_rs/0.136.0
      refreshUrl: https://auth.openai.com/oauth/token
      clientId: app_EMoamEEZ73f0CkXaXp7hrann
    oauth:
      clientId: app_EMoamEEZ73f0CkXaXp7hrann
      authorizeUrl: https://auth.openai.com/oauth/authorize
      tokenUrl: https://auth.openai.com/oauth/token
      scope: "openid profile email offline_access"
      codeChallengeMethod: S256
      fixedPort: 1455
      callbackPath: /auth/callback
      refreshLeadMs: 432000000
    models:
      - id: gpt-5.6-sol
        name: GPT 5.6 Sol
      - id: gpt-5.6-sol-review
        name: GPT 5.6 Sol Review
        upstream: gpt-5.6-sol
      - id: gpt-5.6-terra
        name: GPT 5.6 Terra
      - id: gpt-5.6-terra-review
        name: GPT 5.6 Terra Review
        upstream: gpt-5.6-terra
      - id: gpt-5.6-luna
        name: GPT 5.6 Luna
      - id: gpt-5.6-luna-review
        name: GPT 5.6 Luna Review
        upstream: gpt-5.6-luna
      - id: gpt-5.5
        name: GPT 5.5
      - id: gpt-5.4
        name: GPT 5.4
      - id: gpt-5.4-mini
        name: GPT 5.4 Mini

# Custom API-key providers are added at runtime via dashboard/admin API and
# persisted in the DB (provider_nodes table) — they survive restarts.
# POST /admin/providers  {"name","alias","baseUrl","apiKey","models","format"}
# POST /admin/keys       {"name"}  → returns sr-* key (shown once)
